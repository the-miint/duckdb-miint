#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5-variegata
      extension_name: miint
      extra_toolchains: 'rust'
      exclude_archs: 'windows_amd64_rtools;windows_amd64'

  test-with-bowtie2:
    name: Test with Bowtie2
    runs-on: ubuntu-latest
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: 'x64-linux'
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install build dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Install bowtie2 via conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: bioconda,conda-forge,defaults
          channel-priority: strict

      - name: Install bowtie2
        shell: bash -el {0}
        run: |
          conda install -y bowtie2
          bowtie2 --version
          bowtie2-build --version

      - name: Install gpl-boundary (FastTree process-isolation host)
        shell: bash -el {0}
        run: |
          # Use the upstream installer; binary lands in $HOME/.local/bin.
          # This is the same install ladder users hit when running
          # `SELECT install_gpl_boundary()` interactively. We do it here so
          # CI exercises miint's runtime path-finding (FindGplBoundary picks
          # this up via PATH for the parity tests, and run_tests.sh detects
          # it via `command -v gpl-boundary` and exports GPL_BOUNDARY_AVAILABLE).
          # Pinned to "latest" per project policy; bump install.sh's release
          # tag to lock to a specific upstream version.
          curl -fsSL https://github.com/the-miint/GPL-boundary/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/gpl-boundary" --version | head -3

      - name: Install FastTree (parity oracle)
        shell: bash -el {0}
        run: |
          # bioconda's FastTree binary is the independent ML oracle for
          # `phylogeny_fasttree_parity.test`. The vendored ext/fasttree library
          # inside gpl-boundary is what miint actually drives at runtime;
          # this binary is what we compare against to verify they agree.
          conda install -y -c bioconda fasttree
          FastTree 2>&1 | head -1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

      - name: Build extension
        run: make release

      - name: Run all tests
        shell: bash -el {0}
        run: bash run_tests.sh

      - name: Install tutorial test dependencies
        shell: bash -el {0}
        run: pip install duckdb==$(./build/release/duckdb -csv -noheader -c "SELECT ltrim(version(), 'v');") pyarrow pandas matplotlib

      - name: Run tutorial tests
        shell: bash -el {0}
        run: PYTHON=python3 bash onboarding-tutorials/run_tutorial_tests.sh ./build/release/duckdb

  test-wasm-compatible-build:
    name: Test WASM-compatible build (no HDF5/Bowtie2)
    runs-on: ubuntu-latest
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: 'x64-linux'
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install build dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

      - name: Build extension (HDF5=OFF, Bowtie2=OFF)
        run: EXT_FLAGS="-DMIINT_ENABLE_HDF5=OFF -DMIINT_ENABLE_BOWTIE2=OFF" make release

      - name: Run SQL tests
        run: make test

      - name: Run C++ unit tests
        run: ./build/release/extension/miint/tests

  verify-wasm:
    name: Verify WASM extension imports
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wasm_arch: [wasm_eh, wasm_mvp, wasm_threads]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: miint-v1.5.2-extension-${{ matrix.wasm_arch }}

      - name: Find WASM file
        id: find-wasm
        run: |
          WASM_FILE=$(find . -name "*.duckdb_extension.wasm" | head -1)
          echo "wasm_file=$WASM_FILE" >> $GITHUB_OUTPUT
          echo "Found: $WASM_FILE ($(du -h "$WASM_FILE" | cut -f1))"

      - name: Verify no unresolved library imports
        run: |
          node -e "
            const fs = require('fs');
            const buf = fs.readFileSync('${{ steps.find-wasm.outputs.wasm_file }}');
            WebAssembly.compile(buf).then(mod => {
                const imports = WebAssembly.Module.imports(mod);
                const exports = WebAssembly.Module.exports(mod);
                const exportNames = new Set(exports.map(e => e.name));

                // Library symbols that must be statically linked
                const libPatterns = [
                    /^gz(close|open|d?open|read|write|gets|puts|eof|rewind|seek|tell|flush)/,
                    /^(deflate|inflate|compress|uncompress|adler32|crc32)/,
                    /^hts_/,  /^sam_/,  /^bam_/,  /^bcf_/,  /^bgzf_/,
                    /^mm_/,  /^mm2_/,  /^wavefront/,  /^XML_/,  /^rype_/,
                ];
                const isLib = name => libPatterns.some(p => p.test(name));

                // Direct env imports = not linked at all
                const badDirect = imports.filter(i => i.module === 'env' && isLib(i.name));
                // GOT imports without matching exports = linked but PIC resolution broken
                const gotImports = imports.filter(i =>
                    (i.module === 'GOT.func' || i.module === 'GOT.mem') && isLib(i.name)
                );
                const badGot = gotImports.filter(i => !exportNames.has(i.name));
                const hasInit = exportNames.has('miint_duckdb_cpp_init');

                const problems = [];
                if (!hasInit) problems.push('Missing miint_duckdb_cpp_init export');
                badDirect.forEach(i => problems.push('Unlinked: env.' + i.name));
                badGot.forEach(i => problems.push('GOT without export: ' + i.module + '.' + i.name));

                if (problems.length > 0) {
                    console.error('WASM import verification FAILED:');
                    problems.forEach(p => console.error('  ' + p));
                    process.exit(1);
                }
                console.log('Imports: ' + imports.length + ' total, ' + gotImports.length + ' library GOT (all self-resolved)');
                console.log('Exports: ' + exports.length + ' total, miint_duckdb_cpp_init present');
                console.log('PASS');
            }).catch(err => {
                console.error('WebAssembly.compile failed:', err.message);
                process.exit(1);
            });
          "

  test-wasm-load:
    name: Test WASM extension loads
    runs-on: ubuntu-latest
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.71

      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-emscripten

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Build WASM extension
        run: ./scripts/build_wasm.sh --build-only

      - name: Build DuckDB WASM core and run load test
        run: ./scripts/test_wasm_load.sh

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5-variegata
      extension_name: miint
      format_checks: 'format;tidy'
