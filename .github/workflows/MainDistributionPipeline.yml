#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, v1.5-variegata]
    tags: ['v[0-9]+*']
    paths-ignore:
      - 'docs/**'
      - 'localdocs/**'
      - 'README.md'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'localdocs/**'
      - 'README.md'
      - '*.md'
  workflow_dispatch:
  # Nightly, test-with-bowtie2 and tutorials run against the real ENA, which every other
  # run replaces with a mock (docs/testing.md, "Guards and skipped tests"). Nothing else
  # runs.
  schedule:
    - cron: '23 7 * * *'

# Opt JavaScript actions into Node.js 24 ahead of the June 2026 forced cutover.
# Silences "Node.js 20 actions are deprecated" runner warnings without
# requiring an action-by-action version bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    if: github.event_name != 'schedule'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: miint
      extra_toolchains: 'rust;omp'
      # mmvec compiles its objective once per instruction set and picks the widest
      # the CPU offers at load time, and a wider kernel rounds differently -- so a
      # fitted model, and every value carved from one, depends on which kernel ran.
      # The carved expectations are all taken against `baseline`, which is why
      # run_tests.sh exports it. These lanes run `make test_<type>` directly rather
      # than through that script, so without this they resolve `auto` and fail on
      # any runner wide enough to pick avx2/avx512. The reusable workflow feeds
      # test_env_variables into docker_env.txt AND into the non-docker test step,
      # so this one line covers both.
      test_config: '{"test_env_variables": {"MIINT_SIMD": "baseline"}}'
      # Restore caches everywhere, but only SAVE on push to a tracked branch
      # or tag. The reusable workflow keys each arch's ccache with a timestamp,
      # so saving on PRs writes up to 3 fresh ~1G caches per run into the
      # shared 10G repo budget, LRU-evicting the good caches seeded by
      # main/v1.5-variegata. PRs now ride the base-branch cache read-only.
      save_cache: ${{ github.event_name != 'pull_request' }}
      # Always exclude: windows MSVC (broken), windows_amd64_rtools (broken),
      # osx_amd64 (Intel mac, sunsetting), wasm_mvp + wasm_threads (we only
      # ship wasm_eh).
      # On pull_request also exclude windows_amd64_mingw and wasm_eh — Windows
      # and WASM build/verify only on push to main/v1.5-variegata/tags so
      # release candidates still cover them, while PRs only pay for Linux + macOS.
      # WASM (wasm_eh) is an expensive build, so it runs ONLY on tag pushes —
      # excluded on branch pushes and PRs. Windows (all variants) + osx_amd64 +
      # wasm_mvp/wasm_threads stay excluded everywhere (broken / not shipped).
      # Tag builds drop wasm_eh from the exclude list so release artifacts carry it.
      exclude_archs: ${{ startsWith(github.ref, 'refs/tags/') && 'windows_amd64_rtools;windows_amd64;windows_amd64_mingw;osx_amd64;wasm_mvp;wasm_threads' || 'windows_amd64_rtools;windows_amd64;windows_amd64_mingw;osx_amd64;wasm_eh;wasm_mvp;wasm_threads' }}

  test-with-bowtie2:
    name: Test with Bowtie2
    # The tutorials job runs this job's CLI, so both pin one image: a CLI built on a
    # newer one can need a glibc the other lacks.
    runs-on: ubuntu-24.04
    outputs:
      build-uploaded: ${{ steps.upload-build.outcome }}
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: 'x64-linux'
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      # gpl-boundary, the FastTree process-isolation host. FindGplBoundary finds it on
      # PATH for the parity tests, and run_tests.sh exports GPL_BOUNDARY_AVAILABLE when
      # `command -v gpl-boundary` does. It is installed with the upstream installer,
      # which `SELECT install_gpl_boundary()` also runs, and cached by release tag: a
      # run downloads only when a new release has shipped. GitHub's release downloads
      # have failed this job, with 503s for half an hour on 2026-08-12, so if the
      # release lookup fails too, the newest cached binary is used instead.
      - name: Look up the latest gpl-boundary release
        id: gplb-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/the-miint/GPL-boundary/releases/latest --jq .tag_name) || tag=
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The installer and the cache both put it here.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore gpl-boundary
        id: gplb-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/bin/gpl-boundary
          key: gpl-boundary-x86_64-linux-${{ steps.gplb-release.outputs.tag || 'unresolved' }}
          restore-keys: gpl-boundary-x86_64-linux-

      - name: Install gpl-boundary
        # Skipped on an exact hit, and when the lookup failed but an older binary was
        # restored.
        if: >-
          steps.gplb-cache.outputs.cache-hit != 'true' &&
          (steps.gplb-release.outputs.tag != '' || steps.gplb-cache.outputs.cache-matched-key == '')
        env:
          GPL_BOUNDARY_VERSION: ${{ steps.gplb-release.outputs.tag || 'latest' }}
        run: |
          # To a file, not piped to sh: a retry after part of the script was written
          # to a pipe would run that part twice.
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/install-gpl-boundary.sh" \
            https://github.com/the-miint/GPL-boundary/releases/latest/download/install.sh
          sh "$RUNNER_TEMP/install-gpl-boundary.sh"
          # No smoke check here on purpose: install.sh already prints the version
          # JSON, and `gpl-boundary --version | head -3` intermittently killed this
          # step. `--version` emits a 25-line JSON document, so head closes the pipe
          # after 3 lines; if the binary still has a write outstanding it panics on
          # EPIPE ("failed printing to stdout: Broken pipe", exit 101), and this
          # shell runs with pipefail, so the step fails and every later step —
          # including the build and the whole test suite — is skipped.

      - name: Save gpl-boundary
        if: steps.gplb-release.outputs.tag != '' && steps.gplb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/bin/gpl-boundary
          key: gpl-boundary-x86_64-linux-${{ steps.gplb-release.outputs.tag }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: fef715db0cad13d7db3a29797969a57b44e73531

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: ccache-test-with-bowtie2
          # DuckDB-core compile working set measured at ~1.0 GB (ccache -s:
          # 99.6% hit rate). The old 1G cap sat right at that limit, risking
          # eviction; 2G gives headroom. Note: compilation is NOT this job's
          # bottleneck (cache already hits ~99%) — the dependency build is,
          # see the vcpkg binary cache below. Raise further only against the
          # 10G repo cache budget shared across all branches/jobs.
          max-size: 2G

      # Persist vcpkg's binary cache across runs. WHY: lukka/run-vcpkg points
      # VCPKG_BINARY_SOURCES at the `x-gha` backend, which vcpkg has REMOVED
      # ("the 'x-gha' binary caching backend has been removed"), so this job
      # had no binary cache and rebuilt every dependency from source every run
      # (~5m39s measured: openssl 2.2m, hdf5 1.9m, curl/rocksdb/zstd/zlib/...).
      # A `files` cache backed by actions/cache fixes it. Stable key on the
      # manifest hash: deps change only when vcpkg.json (incl. builtin-baseline)
      # changes, so unchanged runs are exact hits (no re-save); a changed
      # manifest restores the prior cache via restore-keys and rebuilds only
      # the deltas. vcpkg keys stored zips by ABI hash, so a stale entry is
      # never miscompiled — at worst rebuilt and re-added. Bump -v1 to bust.
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_bincache
          key: vcpkg-bincache-x64-linux-v1-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-x64-linux-v1-

      - name: Build extension
        # Override run-vcpkg's dead `x-gha` source with our actions/cache-backed
        # `files` cache (persisted above). `clear` drops all defaults. Set inline
        # so it wins over the value run-vcpkg writes to $GITHUB_ENV.
        # NB: duckdb's public HTTP read cache was tried here and measured 0 hits
        # (run 28135833867) — ubuntu-latest's gcc ABI doesn't match duckdb's
        # manylinux-docker toolchain, so its prebuilt zips never match. Dropped.
        run: |
          VCPKG_BINARY_SOURCES="clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite" \
            make release

      # For the tutorials job. Uploaded before the test suite runs, so the tutorials run
      # even when it fails.
      - name: Upload the CLI and extension
        id: upload-build
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-build
          path: |
            build/release/duckdb
            build/release/extension/miint/miint.duckdb_extension
          if-no-files-found: error
          retention-days: 3
          # A re-run of this job uploads again under the same name.
          overwrite: true

      - name: Run all tests
        env:
          MIINT_ENA_LIVE_TEST: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash run_tests.sh

  # The tutorials in a job of their own, from test-with-bowtie2's build, so that
  # "Re-run failed jobs" reruns them alone, without a rebuild.
  tutorials:
    name: Tutorials
    needs: test-with-bowtie2
    if: ${{ !cancelled() && needs.test-with-bowtie2.outputs.build-uploaded == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tutorial-build
          path: build/release

      - name: Install tutorial test dependencies
        # The artifact drops the executable bit. The Python client must be the
        # DuckDB version the extension was built against, or it cannot load it.
        run: |
          chmod +x build/release/duckdb
          python3 -m pip install --user duckdb==$(./build/release/duckdb -csv -noheader -c "SELECT ltrim(version(), 'v');") pyarrow pandas matplotlib

      - name: Run tutorial tests
        env:
          MIINT_TUTORIAL_LIVE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: PYTHON=python3 bash onboarding-tutorials/run_tutorial_tests.sh ./build/release/duckdb

