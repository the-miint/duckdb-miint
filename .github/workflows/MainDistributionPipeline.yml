#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main, v1.5-variegata]
    tags: ['v[0-9]+*']
    paths-ignore:
      - 'docs/**'
      - 'localdocs/**'
      - 'README.md'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'localdocs/**'
      - 'README.md'
      - '*.md'
  workflow_dispatch:

# Opt JavaScript actions into Node.js 24 ahead of the June 2026 forced cutover.
# Silences "Node.js 20 actions are deprecated" runner warnings without
# requiring an action-by-action version bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: miint
      extra_toolchains: 'rust;omp'
      # Restore caches everywhere, but only SAVE on push to a tracked branch
      # or tag. The reusable workflow keys each arch's ccache with a timestamp,
      # so saving on PRs writes up to 3 fresh ~1G caches per run into the
      # shared 10G repo budget, LRU-evicting the good caches seeded by
      # main/v1.5-variegata. PRs now ride the base-branch cache read-only.
      save_cache: ${{ github.event_name != 'pull_request' }}
      # Always exclude: windows MSVC (broken), windows_amd64_rtools (broken),
      # osx_amd64 (Intel mac, sunsetting), wasm_mvp + wasm_threads (we only
      # ship wasm_eh).
      # On pull_request also exclude windows_amd64_mingw and wasm_eh — Windows
      # and WASM build/verify only on push to main/v1.5-variegata/tags so
      # release candidates still cover them, while PRs only pay for Linux + macOS.
      #exclude_archs: ${{ github.event_name == 'pull_request' && 'windows_amd64_rtools;windows_amd64;windows_amd64_mingw;osx_amd64;wasm_eh;wasm_mvp;wasm_threads' || 'windows_amd64_rtools;windows_amd64;osx_amd64;wasm_mvp;wasm_threads' }}
      # temporarily disable windows and wasm builds entirely
      exclude_archs: ${{ 'windows_amd64_rtools;windows_amd64;windows_amd64_mingw;osx_amd64;wasm_eh;wasm_mvp;wasm_threads' }}

  test-with-bowtie2:
    name: Test with Bowtie2
    runs-on: ubuntu-latest
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: 'x64-linux'
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Install bowtie2 via conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: bioconda,conda-forge,defaults
          channel-priority: strict

      - name: Install bowtie2
        shell: bash -el {0}
        run: |
          conda install -y bowtie2
          bowtie2 --version
          bowtie2-build --version

      - name: Install gpl-boundary (FastTree process-isolation host)
        shell: bash -el {0}
        run: |
          # Use the upstream installer; binary lands in $HOME/.local/bin.
          # This is the same install ladder users hit when running
          # `SELECT install_gpl_boundary()` interactively. We do it here so
          # CI exercises miint's runtime path-finding (FindGplBoundary picks
          # this up via PATH for the parity tests, and run_tests.sh detects
          # it via `command -v gpl-boundary` and exports GPL_BOUNDARY_AVAILABLE).
          # Pinned to "latest" per project policy; bump install.sh's release
          # tag to lock to a specific upstream version.
          curl -fsSL https://github.com/the-miint/GPL-boundary/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/gpl-boundary" --version | head -3

      - name: Install FastTree (parity oracle)
        shell: bash -el {0}
        run: |
          # bioconda's FastTree binary is the independent ML oracle for
          # `phylogeny_fasttree_parity.test`. The vendored ext/fasttree library
          # inside gpl-boundary is what miint actually drives at runtime;
          # this binary is what we compare against to verify they agree.
          conda install -y -c bioconda fasttree
          # FastTree has no `--version` flag — invoking it with no input prints
          # the version banner to stderr and exits non-zero. We just want to
          # confirm the binary is reachable; swallow the exit code.
          FastTree 2>&1 | head -1 || true
          which FastTree

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: fef715db0cad13d7db3a29797969a57b44e73531

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        continue-on-error: true
        with:
          key: ccache-test-with-bowtie2
          # DuckDB-core compile working set measured at ~1.0 GB (ccache -s:
          # 99.6% hit rate). The old 1G cap sat right at that limit, risking
          # eviction; 2G gives headroom. Note: compilation is NOT this job's
          # bottleneck (cache already hits ~99%) — the dependency build is,
          # see the vcpkg binary cache below. Raise further only against the
          # 10G repo cache budget shared across all branches/jobs.
          max-size: 2G

      # Persist vcpkg's binary cache across runs. WHY: lukka/run-vcpkg points
      # VCPKG_BINARY_SOURCES at the `x-gha` backend, which vcpkg has REMOVED
      # ("the 'x-gha' binary caching backend has been removed"), so this job
      # had no binary cache and rebuilt every dependency from source every run
      # (~5m39s measured: openssl 2.2m, hdf5 1.9m, curl/rocksdb/zstd/zlib/...).
      # A `files` cache backed by actions/cache fixes it. Stable key on the
      # manifest hash: deps change only when vcpkg.json (incl. builtin-baseline)
      # changes, so unchanged runs are exact hits (no re-save); a changed
      # manifest restores the prior cache via restore-keys and rebuilds only
      # the deltas. vcpkg keys stored zips by ABI hash, so a stale entry is
      # never miscompiled — at worst rebuilt and re-added. Bump -v1 to bust.
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_bincache
          key: vcpkg-bincache-x64-linux-v1-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-x64-linux-v1-

      - name: Build extension
        # Override run-vcpkg's dead `x-gha` source with our actions/cache-backed
        # `files` cache (persisted above). `clear` drops all defaults. Set inline
        # so it wins over the value run-vcpkg writes to $GITHUB_ENV.
        # NB: duckdb's public HTTP read cache was tried here and measured 0 hits
        # (run 28135833867) — ubuntu-latest's gcc ABI doesn't match duckdb's
        # manylinux-docker toolchain, so its prebuilt zips never match. Dropped.
        run: |
          VCPKG_BINARY_SOURCES="clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite" \
            make release

      - name: Run all tests
        shell: bash -el {0}
        run: bash run_tests.sh

      - name: Install tutorial test dependencies
        shell: bash -el {0}
        # Pin BOTH install and runtime to `/usr/bin/python3` (system Python
        # 3.12). Under `shell: bash -el {0}`, conda-incubator/setup-miniconda
        # auto-activates a "test" env whose python3 has no pip module
        # ("No module named pip"), so `python3 -m pip` fails. Meanwhile bare
        # `pip` resolves to system pip (Python 3.12) and falls back to user
        # site-packages ("Defaulting to user installation"), but the next
        # step's `python3` would resolve to conda's and miss those installs.
        # Using the absolute path `/usr/bin/python3` for both steps sidesteps
        # the conda env entirely for this Python concern while leaving
        # bowtie2 / FastTree (conda-installed binaries) untouched on PATH.
        run: /usr/bin/python3 -m pip install --user duckdb==$(./build/release/duckdb -csv -noheader -c "SELECT ltrim(version(), 'v');") pyarrow pandas matplotlib

      - name: Run tutorial tests
        shell: bash -el {0}
        run: PYTHON=/usr/bin/python3 bash onboarding-tutorials/run_tutorial_tests.sh ./build/release/duckdb

